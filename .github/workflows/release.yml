name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate release notes
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n1)
          if [ -z "$PREV_TAG" ]; then
            RANGE="${GITHUB_REF_NAME}"
          else
            RANGE="${PREV_TAG}..${GITHUB_REF_NAME}"
          fi
          .github/scripts/release-notes.sh "$RANGE" > release_notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" --notes-file release_notes.md
